<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Splendid Lucky Draw</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #0f1523; 
            color: #f8fafc;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
            /* Ensures scrollability without hidden overflows */
            min-height: 100vh; 
        }

        /* Custom Cards matching the spec */
        .app-card {
            background-color: #1e2638;
            border: 1px solid #2a3449;
            border-radius: 0.75rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .app-input {
            background-color: #0b1120;
            border: 1px solid #2a3449;
        }

        /* Glowing Header Text Effect */
        .title-glow {
            text-shadow: 
                0px 3px 3px rgba(0,0,0,0.9),
                0px 0px 20px rgba(250, 204, 21, 0.7),
                2px 2px 0px rgba(234, 179, 8, 0.5);
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0b1120; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Animations */
        @keyframes needle-pulse {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(3px); }
        }
        .needle-anim {
            animation: needle-pulse 1.2s infinite ease-in-out;
        }
    </style>
</head>
<body class="flex flex-col items-center pb-12">

    <!-- HEADER -->
    <header class="w-full bg-[#0b1120] border-b-[3px] border-yellow-500 pt-8 pb-6 flex flex-col items-center justify-center relative z-20 shadow-lg shadow-yellow-500/10">
        <h1 class="text-3xl md:text-4xl font-black italic tracking-wide text-transparent bg-clip-text bg-gradient-to-b from-yellow-200 via-yellow-400 to-yellow-600 title-glow text-center px-4 leading-tight">
            SPLENDID LUCKY DRAW
        </h1>
        <p class="text-[10px] md:text-xs font-bold text-gray-300 uppercase tracking-widest mt-1.5 shadow-sm">
            Play Splendid, Win Splendid
        </p>
    </header>

    <!-- MAIN CONTENT (Constrained width for mobile-app feel) -->
    <main class="w-full max-w-2xl px-4 mt-6 space-y-6 z-10 flex-grow">
        
        <!-- CARD 1: PLAYER POOL -->
        <div class="app-card p-5">
            <div class="flex items-center gap-2 mb-4">
                <svg class="w-5 h-5 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <h2 class="text-sm font-black text-yellow-500 uppercase tracking-wider">Player Pool</h2>
            </div>
            
            <div class="flex justify-between items-center mb-2">
                <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Paste Names</span>
                <span id="poolCount" class="bg-yellow-500/20 text-yellow-500 text-[10px] py-0.5 px-2 rounded-full font-bold border border-yellow-500/30">0</span>
            </div>
            
            <textarea id="namesInput" class="app-input w-full min-h-[160px] text-slate-200 rounded-lg p-3 focus:outline-none focus:border-blue-500 resize-y mb-4 shadow-inner text-sm font-medium placeholder-slate-600 leading-relaxed" placeholder="John Doe&#10;Jane Smith&#10;Pickleball Pro..."></textarea>
            
            <button id="loadBtn" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold text-xs uppercase tracking-widest py-3.5 px-4 rounded-lg transition-all shadow-md active:scale-95 flex justify-center items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                Load Names To Wheel
            </button>
        </div>

        <!-- CARD 2: THE WHEEL -->
        <div class="app-card p-6 flex flex-col items-center relative overflow-hidden">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-[0.2em] mb-6">The Splendid Wheel</h2>
            
            <!-- Wheel Container -->
            <div class="relative w-full max-w-[340px] aspect-square mx-auto flex items-center justify-center">
                
                <!-- The Needle (Gold downward triangle) -->
                <div class="absolute top-[-6px] left-1/2 transform -translate-x-1/2 z-20 needle-anim drop-shadow-[0_3px_3px_rgba(0,0,0,0.8)]">
                    <div class="w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-t-[26px] border-t-yellow-500"></div>
                </div>
                
                <!-- Canvas -->
                <canvas id="wheelCanvas" width="600" height="600" class="w-full h-full rounded-full border-[6px] border-[#2a3449] bg-[#1a2332] shadow-[0_0_40px_rgba(0,0,0,0.6)]"></canvas>
                
                <!-- Center Hub -->
                <div class="absolute inset-0 m-auto w-14 h-14 rounded-full bg-[#0b1120] border-[4px] border-yellow-500 z-10 flex items-center justify-center shadow-lg">
                    <div class="w-2.5 h-2.5 bg-yellow-500 rounded-full shadow-[0_0_8px_#facc15]"></div>
                </div>
            </div>
            
            <!-- Spin Button -->
            <button id="spinBtn" disabled class="mt-8 w-[80%] max-w-[260px] bg-gradient-to-b from-[#dfae37] to-[#a3791a] hover:from-[#ecc053] hover:to-[#b88c24] text-[#0b1120] font-black text-2xl tracking-[0.15em] uppercase py-3.5 px-6 rounded-xl transition-all shadow-[0_4px_20px_rgba(0,0,0,0.5)] active:scale-95 disabled:opacity-30 disabled:cursor-not-allowed border border-yellow-300/40">
                SPIN!
            </button>
        </div>

        <!-- CARD 3: CURRENT SESSION & HISTORY -->
        <div class="app-card p-5">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2">
                    <svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <h2 class="text-sm font-black text-emerald-500 uppercase tracking-wider" id="currentSessionTitle">Current Session</h2>
                </div>
                <span id="winnersCount" class="bg-emerald-500/20 text-emerald-500 text-[10px] py-0.5 px-2 rounded font-bold border border-emerald-500/30">0</span>
            </div>
            
            <!-- Inner History Box -->
            <div class="app-input w-full rounded-lg p-3 min-h-[120px] mb-4 overflow-y-auto max-h-[250px]" id="currentHistory">
                <p class="text-slate-500 text-xs italic text-center mt-8 font-medium">No winners drawn yet.</p>
            </div>
            
            <button id="saveSessionBtn" class="w-full bg-slate-800/80 hover:bg-slate-700 text-emerald-400 border border-emerald-500/30 py-3 rounded-lg shadow font-bold text-xs uppercase tracking-widest transition-colors mb-6 flex justify-center items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                Save & Start New Session
            </button>

            <!-- Past Sessions Section -->
            <div class="border-t border-slate-700/50 pt-5">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xs font-black text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Past Sessions
                    </h3>
                    <button id="clearAllHistoryBtn" class="text-[10px] font-bold text-red-400 hover:text-red-300 uppercase tracking-wider transition-colors bg-red-500/10 px-2 py-1 rounded border border-red-500/20">Clear All</button>
                </div>
                <div id="pastSessionsContainer" class="w-full max-h-[250px] overflow-y-auto space-y-3 pr-1">
                    <p class="text-slate-600 text-xs italic text-center mt-2 font-medium">No past sessions.</p>
                </div>
            </div>
        </div>

    </main>

    <!-- WINNER MODAL -->
    <div id="winnerModal" class="fixed inset-0 bg-[#0b1120]/95 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4 transition-opacity">
        <div class="bg-[#1e2638] border-[3px] border-yellow-500 rounded-3xl p-6 md:p-8 max-w-sm w-full text-center shadow-[0_0_60px_rgba(234,179,8,0.25)] transform scale-95 opacity-0 transition-all duration-300" id="modalContent">
            
            <h3 class="text-2xl md:text-3xl text-yellow-500 font-black uppercase tracking-[0.2em] mb-4">Winner!</h3>
            
            <div class="bg-[#0b1120] border border-slate-700 rounded-2xl py-8 px-4 mb-6 shadow-inner relative overflow-hidden">
                <!-- Background glow effect in box -->
                <div class="absolute inset-0 bg-yellow-500/5 blur-2xl"></div>
                <div id="winnerText" class="text-3xl md:text-4xl font-black text-white drop-shadow-[0_2px_10px_rgba(255,255,255,0.3)] break-words leading-tight relative z-10"></div>
            </div>
            
            <button id="closeModalBtn" class="w-full bg-gradient-to-r from-yellow-500 to-yellow-600 hover:from-yellow-400 hover:to-yellow-500 text-[#0b1120] rounded-xl transition-transform active:scale-95 shadow-[0_0_15px_rgba(234,179,8,0.4)] flex flex-col items-center justify-center py-3">
                <span class="font-black text-sm uppercase tracking-widest">Awesome!</span>
                <span class="text-[10px] font-bold opacity-80 mt-0.5 tracking-wide">(Remove from pool)</span>
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- State Management ---
        let pool = [];
        let sliceColors = [];
        let currentWinners = [];
        let pastSessions = [];
        
        // --- Wheel Theme Colors (Deep Blue, Gold, Cyan, Green, Indigo) ---
        const themeColors = [
            { bg: '#1e3a8a', text: '#ffffff' }, 
            { bg: '#eab308', text: '#0f1523' }, 
            { bg: '#0891b2', text: '#ffffff' }, 
            { bg: '#22c55e', text: '#0f1523' }, 
            { bg: '#6366f1', text: '#ffffff' }  
        ];

        // --- Local Storage Initialization ---
        const STORAGE_KEY = 'splendid_lucky_draw_master_v2'; // Bumped version to ensure clean slate if needed
        try {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) pastSessions = JSON.parse(stored);
        } catch(e) { console.error("Local storage error:", e); }
        
        // Determine session counter based on history
        let sessionCounter = pastSessions.length > 0 ? Math.max(...pastSessions.map(s => s.id)) + 1 : 1;
        
        // Physics variables
        let currentAngle = 0;
        let isSpinning = false;
        let audioCtx;

        // --- DOM Elements ---
        const els = {
            namesInput: document.getElementById('namesInput'),
            loadBtn: document.getElementById('loadBtn'),
            spinBtn: document.getElementById('spinBtn'),
            canvas: document.getElementById('wheelCanvas'),
            ctx: document.getElementById('wheelCanvas').getContext('2d'),
            poolCount: document.getElementById('poolCount'),
            winnersCount: document.getElementById('winnersCount'),
            currentSessionTitle: document.getElementById('currentSessionTitle'),
            currentHistory: document.getElementById('currentHistory'),
            saveSessionBtn: document.getElementById('saveSessionBtn'),
            pastSessionsContainer: document.getElementById('pastSessionsContainer'),
            clearAllHistoryBtn: document.getElementById('clearAllHistoryBtn'),
            winnerModal: document.getElementById('winnerModal'),
            modalContent: document.getElementById('modalContent'),
            winnerText: document.getElementById('winnerText'),
            closeModalBtn: document.getElementById('closeModalBtn')
        };

        // --- Init ---
        els.currentSessionTitle.innerText = `Session ${sessionCounter}`;
        updatePastSessionsUI();
        drawWheel(); 

        // --- Audio Logic (Web Audio API) ---
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTickSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.05);
            
            gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playWinSound() {
            if (!audioCtx) return;
            const notes = [440, 554.37, 659.25, 880]; // A4, C#5, E5, A5 (Arpeggio)
            let startTime = audioCtx.currentTime;
            
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                const time = startTime + (index * 0.1);
                gain.gain.setValueAtTime(0, time);
                gain.gain.linearRampToValueAtTime(0.4, time + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.8);
                
                osc.start(time);
                osc.stop(time + 0.8);
            });
        }

        // --- Logic: Assign Colors ---
        function assignColors() {
            sliceColors = [];
            for (let i = 0; i < pool.length; i++) {
                let colorObj = themeColors[i % themeColors.length];
                // Prevent first and last colors from matching if pool is odd
                if (i === pool.length - 1 && pool.length % themeColors.length === 1 && pool.length > 1) {
                    colorObj = themeColors[(i + 1) % themeColors.length];
                }
                sliceColors.push(colorObj);
            }
        }

        // --- Logic: Format Time ---
        function getFormattedTime() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        function getFormattedDate() {
            return new Date().toLocaleDateString([], { year: 'numeric', month: 'short', day: 'numeric' }) + ' ' + getFormattedTime();
        }

        // --- Event 1: Load Names ---
        els.loadBtn.addEventListener('click', () => {
            const rawNames = els.namesInput.value.split('\n').map(n => n.trim()).filter(n => n.length > 0);
            pool = [...new Set(rawNames)]; // Remove duplicates
            
            if (pool.length === 0) {
                alert('Please paste at least one valid name.');
                return;
            }

            assignColors();
            els.poolCount.innerText = pool.length;
            els.namesInput.value = pool.join('\n');
            currentAngle = 0; 
            drawWheel();
            
            els.spinBtn.disabled = false;
        });

        // --- Event 2: Spin Action ---
        els.spinBtn.addEventListener('click', () => {
            if (pool.length === 0 || isSpinning) return;
            initAudio(); 
            
            isSpinning = true;
            els.spinBtn.disabled = true;
            els.loadBtn.disabled = true;
            els.namesInput.disabled = true;
            
            const spinDuration = Math.random() * 3000 + 4500; // 4.5 to 7.5s
            const spinVelocity = Math.random() * 0.15 + 0.35; // Speed
            let startTime = null;
            let lastHoverIndex = -1;
            const sliceAngle = (2 * Math.PI) / pool.length;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const progress = timestamp - startTime;
                
                if (progress < spinDuration) {
                    // Ease out cubic logic for smooth deceleration
                    const easeOut = 1 - Math.pow(1 - progress / spinDuration, 3);
                    currentAngle += spinVelocity * (1 - easeOut);
                    currentAngle = currentAngle % (2 * Math.PI);
                    
                    // Tick logic: Needle is visually at the top (1.5 PI or 270 degrees)
                    let currentOffset = (1.5 * Math.PI - currentAngle) % (2 * Math.PI);
                    if (currentOffset < 0) currentOffset += (2 * Math.PI);
                    
                    let currentHoverIndex = Math.floor(currentOffset / sliceAngle);

                    if (lastHoverIndex !== -1 && currentHoverIndex !== lastHoverIndex) {
                        playTickSound();
                    }
                    lastHoverIndex = currentHoverIndex;

                    drawWheel();
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    finishSpin();
                }
            }
            requestAnimationFrame(animate);
        });

        // --- Event 3: Close Modal & Handle Winner ---
        els.closeModalBtn.addEventListener('click', () => {
            const winnerName = els.winnerText.dataset.name;
            
            // 1. Remove from pool
            pool = pool.filter(n => n !== winnerName);
            
            // 2. Update textarea & count
            els.namesInput.value = pool.join('\n');
            els.poolCount.innerText = pool.length;
            
            // 3. Add to history
            currentWinners.unshift({ name: winnerName, time: getFormattedTime() });
            updateCurrentHistoryUI();

            // 4. Redraw wheel
            assignColors();
            drawWheel();

            // 5. Hide Modal & Reset State
            els.modalContent.classList.remove('scale-100', 'opacity-100');
            els.modalContent.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                els.winnerModal.classList.add('hidden');
                
                // Immediately Reactivate Spin if pool has names
                if (pool.length > 0) els.spinBtn.disabled = false;
                els.loadBtn.disabled = false;
                els.namesInput.disabled = false;
            }, 300);
        });

        // --- Event 4: Save Session ---
        els.saveSessionBtn.addEventListener('click', () => {
            if (currentWinners.length === 0) {
                alert('No winners to save for this session yet.');
                return;
            }
            
            pastSessions.unshift({
                id: sessionCounter,
                title: `Session ${sessionCounter}`,
                date: getFormattedDate(),
                winners: [...currentWinners]
            });
            
            localStorage.setItem(STORAGE_KEY, JSON.stringify(pastSessions));

            currentWinners = [];
            sessionCounter++;
            els.currentSessionTitle.innerText = `Session ${sessionCounter}`;
            updateCurrentHistoryUI();
            updatePastSessionsUI();
            
            // Clear pool for the new session
            pool = [];
            sliceColors = [];
            els.namesInput.value = '';
            els.poolCount.innerText = '0';
            drawWheel();
            els.spinBtn.disabled = true;
        });

        // --- Event 5: Clear ALL History ---
        els.clearAllHistoryBtn.addEventListener('click', () => {
            if(confirm("Delete ALL past sessions? This cannot be undone.")) {
                pastSessions = [];
                localStorage.removeItem(STORAGE_KEY);
                sessionCounter = 1;
                els.currentSessionTitle.innerText = `Session ${sessionCounter}`;
                updatePastSessionsUI();
            }
        });

        // --- NEW Logic: Delete Individual Session ---
        window.deleteSession = function(id) {
            if(confirm("Delete this specific session?")) {
                pastSessions = pastSessions.filter(s => s.id !== id);
                
                if (pastSessions.length === 0) {
                    sessionCounter = 1;
                    els.currentSessionTitle.innerText = `Session ${sessionCounter}`;
                }
                
                localStorage.setItem(STORAGE_KEY, JSON.stringify(pastSessions));
                updatePastSessionsUI();
            }
        };

        // --- Logic: Drawing the Canvas ---
        function drawWheel() {
            const canvas = els.canvas;
            const ctx = els.ctx;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const radius = canvas.width / 2 - 4; 

            if (pool.length === 0) {
                // Empty state
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#1a2332'; 
                ctx.fill();
                ctx.fillStyle = '#64748b'; 
                ctx.font = 'bold 24px Montserrat, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('AWAITING PLAYERS', cx, cy);
                return;
            }

            const sliceAngle = (2 * Math.PI) / pool.length;

            for (let i = 0; i < pool.length; i++) {
                const startAngle = currentAngle + i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                // Slice Background
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, startAngle, endAngle);
                ctx.fillStyle = sliceColors[i].bg;
                ctx.fill();
                
                // Inner Border Stroke
                ctx.strokeStyle = 'rgba(11, 17, 32, 0.4)'; 
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Text Rendering
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(startAngle + sliceAngle / 2);
                
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = sliceColors[i].text;
                
                // Dynamic scaling based on slice size
                const arcLength = radius * sliceAngle;
                const calculatedSize = arcLength * 0.45; 
                const fontSize = Math.max(12, Math.min(36, calculatedSize));
                ctx.font = `800 ${fontSize}px Montserrat, sans-serif`;
                
                // Subdued shadow for readability
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 3;
                
                // Name truncation if heavily scaled
                let displayName = pool[i];
                if (displayName.length > 20) displayName = displayName.substring(0, 18) + '...';
                
                // Render text with a max-width to prevent hitting the hub
                ctx.fillText(displayName, radius - 20, 0, radius - 70);
                ctx.restore();
            }
        }

        // --- Logic: Handle Spin Completion ---
        function finishSpin() {
            playWinSound();
            
            // Calculate winner based on final angle
            const sliceAngle = (2 * Math.PI) / pool.length;
            let offset = (1.5 * Math.PI - currentAngle) % (2 * Math.PI);
            if (offset < 0) offset += (2 * Math.PI);
            
            const winningIndex = Math.floor(offset / sliceAngle);
            const winner = pool[winningIndex];

            // Confetti Blast
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 },
                colors: ['#eab308', '#3b82f6', '#10b981'],
                zIndex: 100
            });

            // Display Modal
            els.winnerText.innerText = winner;
            els.winnerText.dataset.name = winner; // Store data for deletion logic
            els.winnerModal.classList.remove('hidden');
            
            // Tiny delay ensures transition occurs
            setTimeout(() => {
                els.modalContent.classList.remove('scale-95', 'opacity-0');
                els.modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        // --- UI Rendering ---
        function updateCurrentHistoryUI() {
            els.winnersCount.innerText = currentWinners.length;
            
            if (currentWinners.length === 0) {
                els.currentHistory.innerHTML = '<p class="text-slate-500 text-xs italic text-center mt-8 font-medium">No winners drawn yet.</p>';
                return;
            }
            els.currentHistory.innerHTML = currentWinners.map((win, index) => `
                <div class="flex items-center justify-between border-b border-slate-700/50 py-2.5 last:border-0">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <span class="flex-shrink-0 flex items-center justify-center bg-slate-800 text-emerald-400 border border-emerald-500/30 w-5 h-5 rounded text-[10px] font-black">${currentWinners.length - index}</span>
                        <span class="font-bold text-slate-200 truncate text-sm">${win.name}</span>
                    </div>
                    <span class="text-[10px] text-slate-500 font-semibold flex-shrink-0 ml-2">${win.time}</span>
                </div>
            `).join('');
        }

        function updatePastSessionsUI() {
            if (pastSessions.length === 0) {
                els.pastSessionsContainer.innerHTML = '<p class="text-slate-600 text-xs italic text-center mt-2 font-medium">No past sessions.</p>';
                return;
            }
            els.pastSessionsContainer.innerHTML = pastSessions.map(session => `
                <div class="bg-[#0b1120] rounded-lg p-3.5 border border-[#2a3449]">
                    <div class="flex justify-between items-center mb-2.5 border-b border-slate-700/50 pb-2">
                        <span class="font-black text-slate-300 uppercase text-[11px]">${session.title}</span>
                        <div class="flex items-center gap-2">
                            <span class="text-[9px] text-slate-500 font-bold">${session.date}</span>
                            <button onclick="window.deleteSession(${session.id})" class="text-red-400 hover:text-red-300 hover:bg-red-500/10 transition-colors p-1 rounded border border-transparent hover:border-red-500/20" title="Delete Session">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>
                    <div class="text-[11px] text-slate-400 space-y-1.5">
                        ${session.winners.map((w, i) => `
                            <div class="flex justify-between items-center py-0.5">
                                <span class="truncate pr-2 font-medium"><span class="text-slate-600 mr-2 text-[10px]">#${session.winners.length - i}</span>${w.name}</span>
                                <span class="text-[9px] text-slate-600 flex-shrink-0">${w.time}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
